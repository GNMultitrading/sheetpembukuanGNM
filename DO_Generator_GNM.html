<script>
  function loadScriptWithFallback(urls){
    return new Promise(function(resolve, reject){
      var i = 0;
      function tryNext(){
        if(i >= urls.length){ reject(new Error('Semua sumber gagal: ' + urls.join(', '))); return; }
        var s = document.createElement('script');
        s.src = urls[i++];
        s.onload = function(){ resolve(); };
        s.onerror = function(){ tryNext(); };
        document.head.appendChild(s);
      }
      tryNext();
    });
  }
  window.librariesReady = Promise.all([
    loadScriptWithFallback([
      'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',
      'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js',
      'https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js'
    ]),
    loadScriptWithFallback([
      'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
      'https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js',
      'https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js'
    ])
  ]).then(function(){ window.librariesFailed = false; })
    .catch(function(err){ console.error(err); window.librariesFailed = true; });

  // [UPDATE QR] Library QR code dimuat TERPISAH dari html2canvas/jsPDF di
  // atas dan sengaja tidak pernah membuat proses lain gagal: kalau ketiga
  // sumbernya gagal (mis. jaringan blokir semua CDN), kolom "ISSUED BY"
  // otomatis balik pakai tanda tangan statis lama -- generate PDF/Word
  // tetap jalan normal seperti biasa, tidak ada fitur lain yang ikut rusak.
  window.qrLibReady = loadScriptWithFallback([
    'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js',
    'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js',
    'https://unpkg.com/qrcode-generator@1.4.4/qrcode.js'
  ]).then(function(){ window.qrLibFailed = false; })
    .catch(function(err){ console.error('QR library gagal dimuat, fallback ke tanda tangan statis:', err); window.qrLibFailed = true; });
</script>
<style>
  :root{
    --navy:#1a3560;
    --gold:#d3a828;
    --bg:#e9e6de;
    --paper:#ffffff;
    --line:#8b8b8b;
    --muted:#6b6b6b;
    --edit-bg:#fff6de;
    --red:#c00000;
    --yellow:#ffd60a;
    --blue:#4472c4;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    font-family:'Segoe UI',Calibri,ui-sans-serif,system-ui,sans-serif;
    color:#1c1c1c;
  }

  /* ---- Toolbar ---- */
  .toolbar{
    position:sticky;
    top:0;
    z-index:20;
    background:var(--paper);
    border-bottom:1px solid #d9d7d0;
    padding:10px 18px;
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .toolbar .hint{font-size:12px;color:var(--muted);}
  .spacer{flex:1;}
  .export-btn{
    border:none;border-radius:7px;padding:0 16px;height:34px;
    font-size:13px;font-weight:600;cursor:pointer;
  }
  .btn-docx{background:#2b5797;color:#fff;}
  .btn-docx:hover{background:#234a80;}
  .btn-pdf{background:#a4262c;color:#fff;margin-left:8px;}
  .btn-pdf:hover{background:#8b2024;}
  .btn-reset{background:transparent;color:var(--muted);border:1px solid #d9d7d0;margin-left:8px;}
  .btn-reset:hover{background:#f2f2f2;}

  .doc-toggle{
    display:flex;border:1px solid var(--navy);border-radius:8px;overflow:hidden;height:34px;
  }
  .doc-toggle button{
    border:none;background:#fff;color:var(--navy);font-size:12.5px;font-weight:700;
    padding:0 14px;cursor:pointer;white-space:nowrap;
  }
  .doc-toggle button+button{border-left:1px solid var(--navy);}
  .doc-toggle button.active{background:var(--navy);color:#fff;}
  .doc-toggle button:hover:not(.active){background:#eef1f6;}

  /* ---- Page ---- */
  .page-wrap{display:flex;flex-direction:column;align-items:center;padding:32px 16px 80px;gap:26px;}

  .do-page{
    position:relative;
    background:var(--paper);
    width:210mm;
    min-height:297mm;
    box-shadow:0 2px 14px rgba(0,0,0,0.15);
    padding:12mm 14mm 12mm 22mm;
    font-size:12.5px;
    line-height:1.42;
  }

  .side-tab{
    position:absolute;
    left:0;top:0;bottom:0;width:9mm;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-weight:800;font-size:11.5px;
  }
  .side-tab .tab-char{line-height:1.25;}
  .side-tab .tab-gap{height:7px;}
  .tab-red{background:var(--red);color:#fff;}
  .tab-yellow{background:var(--yellow);color:var(--navy);}
  .tab-blue{background:var(--blue);color:#fff;}

  .do-logo{width:100%;max-width:460px;display:block;margin:0 0 6px;}

  .doc-title{
    text-align:center;font-size:15.5px;font-weight:800;
    text-decoration:underline;color:#111;margin:6px 0 4px;
    line-height:1.3;
  }

  .no-line{
    text-align:center;font-size:12.5px;margin-bottom:14px;
  }
  .no-line b{margin-right:4px;}

  [contenteditable="true"]{outline:none;border-radius:3px;padding:0 3px;margin:0 -3px;}
  [contenteditable="true"]:hover{background:var(--edit-bg);}
  [contenteditable="true"]:focus{background:var(--edit-bg);box-shadow:0 0 0 1px var(--gold);}

  .field-row{
    display:flex;
    margin-bottom:6px;
    align-items:baseline;
  }
  .field-label{width:225px;flex-shrink:0;}
  .field-colon{width:12px;flex-shrink:0;}
  .field-value{
    flex:1;min-width:0;
    border-bottom:1px solid var(--line);
    padding-bottom:1px;
    min-height:15px;
  }
  .field-value .unit{margin-left:4px;color:#333;}

  .note-box{
    border:1px solid #333;
    padding:8px 10px;
    text-align:center;
    font-size:12px;
    margin:8px 0 14px;
  }

  .section-gap{margin-top:6px;}

  .flow-row{display:flex;gap:18px;margin-bottom:6px;}
  .flow-row .field-row{flex:1;margin-bottom:0;}
  .jam-inline{display:flex;align-items:baseline;gap:6px;margin-left:14px;flex-shrink:0;}
  .jam-inline .field-value{width:70px;flex:none;}

  .legend-box{
    margin:14px 0 10px;
    font-size:11.5px;
  }
  .legend-box .legend-title{font-weight:700;margin-bottom:2px;}
  .legend-box div{margin-bottom:1px;}

  table.sign-table{
    width:100%;border-collapse:collapse;margin-top:6px;
  }
  table.sign-table td{
    border:1px solid #333;
    vertical-align:top;
    padding:0;
    width:33.33%;
  }
  .sign-head{
    text-align:center;font-weight:800;font-size:12px;
    padding:6px 4px;border-bottom:1px solid #333;
    background:#f4f2ec;
  }
  .sign-space{
    height:78px;
    display:flex;align-items:center;justify-content:center;
    padding:4px;
  }
  .sign-space img{max-height:74px;max-width:90%;object-fit:contain;}
  .qr-loading{font-size:9px;color:#8b8b8b;text-align:center;}
  .sign-name-row{
    border-top:1px solid #333;
    padding:5px 8px 3px;font-size:11.5px;
    display:flex;gap:4px;
  }
  .sign-name-row .lbl{flex-shrink:0;}
  .sign-name-row .val{flex:1;border-bottom:1px solid var(--line);min-height:14px;}
  .sign-sub{
    padding:2px 8px 8px;font-size:10.5px;text-align:center;color:#333;
  }
  .sign-sub .val{border-bottom:1px solid var(--line);min-height:13px;display:inline-block;min-width:70%;}
  .sign-sub .val.no-line-val{border-bottom:none;}
  .sign-sub.static{font-weight:700;font-size:10px;text-decoration:none;}

  @media print{
    @page{size:A4;margin:0;}
    .toolbar,.no-export{display:none;}
    body{background:#fff;}
    .page-wrap{padding:0;gap:0;}
    .do-page{box-shadow:none;margin:0 auto;page-break-after:always;}
    .do-page:last-child{page-break-after:auto;}
  }
</style>
</head>

  <div class="doc-toggle">
    <button id="toggleDo" onclick="setDocType('do')">🚚 Surat Jalan (Mobil)</button>

  <div class="spacer"></div>

  <button class="export-btn btn-pdf" onclick="exportPdf()">⬇ PDF (3 hlm)</button>
</div>

<div class="page-wrap" id="pageWrap">
</div>

const COPIES = [
  {key:'gnm',         label:'UNTUK GNM',          tab:'tab-red'},
  {key:'transportir', label:'UNTUK TRANSPORTIR',  tab:'tab-yellow'},
  {key:'penerima',    label:'UNTUK PENERIMA',     tab:'tab-blue'}
];

/* ---- Teks tab kiri (mis. "UNTUK GNM") dibikin manual per-huruf, bertumpuk dari atas ke bawah.
   Sengaja TIDAK pakai CSS writing-mode/rotate — itu bikin tulisannya kebalik/berantakan
   pas diexport ke PDF (html2canvas) atau Word, walau di browser kelihatan normal. ---- */
function verticalLabel(text){
  return text.split('').map(ch =>
    ch === ' ' ? `<div class="tab-gap"></div>` : `<div class="tab-char">${ch}</div>`
  ).join('');
}

function fieldRow(label, group, opts){
  opts = opts || {};
  const unit = opts.unit ? `<span class="unit">${opts.unit}</span>` : '';
  const width = opts.labelWidth ? ` style="width:${opts.labelWidth}px"` : '';
  return `<div class="field-row">
    <div class="field-label"${width}>${label}</div>
    <div class="field-colon">:</div>
    <div class="field-value" contenteditable="true" data-group="${group}"></div>${unit}
  </div>`;
}

function buildPage(copy){
  return `
  <div class="do-page" data-copy="${copy.key}">

/* ---- Mode dokumen: 'do' (Surat Jalan, pakai mobil) atau 'bdn' (pakai kapal) ---- */
let docType = 'do';

/* ---- [UPDATE QR] URL verifikasi dokumen (dari Sheet Pembukuan, param verifyUrl).
   null kalau record belum punya verifyToken (record lama / dibuka manual tanpa
   lewat dashboard) -- kolom ISSUED BY akan fallback ke tanda tangan statis. ---- */
let verifyUrl = null;

/* ---- State isian form, disimpan terpisah dari DOM supaya nggak ilang pas toggle DO/BDN ----
   key = data-group, value = teks yang udah diisi. Field dengan nama data-group yang sama
   (mis. doNo, hariTgl, namaDriver, dst) otomatis kebawa walau ganti mode dokumen. ---- */
let formState = {};

function setDocType(type){
  docType = (type === 'bdn') ? 'bdn' : 'do';
  convertDoNoPrefix();
  renderPages();
  updateToggleUI();
}

/* ---- No. dokumen ikut nyesuain pas toggle DO <-> BDN.
   Contoh: "003/DO-GNM/VII/2026" -> "003/BDN-GNM/VII/2026" (dan sebaliknya).
   Kalau formatnya nggak ketemu (belum diisi / gak pakai pola DO-GNM/BDN-GNM), dibiarkan apa adanya. ---- */
function convertDoNoPrefix(){
  if(!formState.doNo) return;
  formState.doNo = (docType === 'bdn')
    ? formState.doNo.replace(/\bDO-GNM\b/gi, 'BDN-GNM')
    : formState.doNo.replace(/\bBDN-GNM\b/gi, 'DO-GNM');
}

function updateToggleUI(){
  document.getElementById('toggleDo').classList.toggle('active', docType === 'do');
  document.getElementById('toggleBdn').classList.toggle('active', docType === 'bdn');
  document.getElementById('modeHint').textContent = docType === 'bdn'
    ? '3 halaman BDN (Untuk GNM / Transportir / Penerima) otomatis sinkron — dipakai kalau pengiriman pakai KAPAL.'
    : '3 halaman DO (Untuk GNM / Transportir / Penerima) otomatis sinkron — dipakai kalau pengiriman pakai MOBIL.';
}

function renderPages(){
  const builder = docType === 'bdn' ? buildBDNPage : buildPage;
  document.getElementById('pageWrap').innerHTML = COPIES.map(builder).join('\n');
  applyFormState();
  renderIssuerSignature();
}

/* ---- [UPDATE QR] Isi kolom "ISSUED BY" dengan QR verifikasi (kalau
   verifyUrl tersedia) atau tanda tangan statis lama (fallback). Dipanggil
   ulang tiap renderPages() -- termasuk saat toggle DO<->BDN -- karena
   .sign-space-issuer dibuat baru lagi tiap render. ---- */
async function renderIssuerSignature(){
  const targets = document.querySelectorAll('.sign-space-issuer');
  if(!targets.length) return;

  const fallbackHtml = `<img src="data:image/jpeg;base64,${SIG_B64}" alt="Tanda tangan &amp; cap">`;

  if(!verifyUrl){
    targets.forEach(el => { el.innerHTML = fallbackHtml; });
    return;
  }

  targets.forEach(el => { el.innerHTML = '<div class="qr-loading">Memuat QR&hellip;</div>'; });

  try{
    if(window.qrLibReady) await window.qrLibReady;
    if(window.qrLibFailed || typeof qrcode === 'undefined'){
      targets.forEach(el => { el.innerHTML = fallbackHtml; });
      return;
    }
    // Type 0 = ukuran modul otomatis menyesuaikan panjang URL (URL Apps
    // Script cukup panjang). Error-correction 'M' (~15% recovery) dipilih
    // sebagai keseimbangan antara kepadatan modul dan ketahanan pas dicetak
    // hitam-putih.
    const qr = qrcode(0, 'M');
    qr.addData(verifyUrl);
    qr.make();
    // cellSize=6, margin=8(px setara ~2 modul quiet-zone minimum standar QR)
    const dataUrl = qr.createDataURL(6, 8);
    targets.forEach(el => {
      el.innerHTML = `<img src="${dataUrl}" alt="QR Verifikasi Dokumen">`;
    });
  }catch(err){
    console.error('Gagal render QR, fallback ke tanda tangan statis:', err);
    targets.forEach(el => { el.innerHTML = fallbackHtml; });
  }
}

/* ---- Isi ulang semua field dari formState setelah render.
   Dipanggil tiap renderPages() supaya toggle DO<->BDN nggak menghapus data yang udah diisi. ---- */
function applyFormState(){
  document.querySelectorAll('[data-group]').forEach(el => {
    const group = el.getAttribute('data-group');
    if(Object.prototype.hasOwnProperty.call(formState, group)){
      el.innerText = formState[group];
    }
  });
}

/* ---- Sinkronisasi antar-halaman & antar-instance field yang sama ---- */
function setupSync(){
  document.getElementById('pageWrap').addEventListener('input', (e) => {
    const el = e.target;
    const group = el.getAttribute('data-group');
    if(!group) return;
    const text = el.innerText;
    formState[group] = text;
    document.querySelectorAll(`[data-group="${group}"]`).forEach(other => {
      if(other !== el) other.innerText = text;
    });
  });
}

/* ---- Auto-fill dari Sheet Pembukuan (URL params) ---- */
function detectDocTypeFromParams(){
  const p = new URLSearchParams(window.location.search);
  // jenis=do (default) atau jenis=bdn -> pilih mode pengiriman (mobil/surat jalan vs kapal/BDN)
  if(p.get('jenis') === 'bdn') docType = 'bdn';
}

/* ---- [UPDATE QR] Baca URL verifikasi (kalau ada) dari param verifyUrl.
   Dipanggil SEBELUM renderPages() pertama kali, supaya render awal langsung
   tahu mau pakai QR atau fallback tanda tangan statis. ---- */
function detectVerifyUrlFromParams(){
  const p = new URLSearchParams(window.location.search);
  verifyUrl = p.get('verifyUrl') || null;
}

function autoFillFromParams(){
  const p = new URLSearchParams(window.location.search);
  const map = {
    do: 'doNo',
    hari: 'hariTgl',
    posup: 'poSupplier',
    qty: 'jumlahPesan',
    poclient: 'poClient',
    lambung: 'lambung',
    plat: 'plat',
    tujuan: 'tujuan',
    segel: 'segel',
    driver: 'namaDriver',
    issuer: 'namaIssuer',
    // Catatan: field BDN "Dikirim Oleh" & "Pengisian Solar Ke" sekarang otomatis
    // ikut nilai "Lambung Transportasi" & "Pengisian Solar Ke" punya Surat Jalan
    // (pakai data-group yang sama: lambung & tujuan), jadi nggak perlu param terpisah.
    // kirim/pengisian tetap didukung sebagai alias kalau suatu saat Sheet mengirim param ini.
    kirim: 'lambung',
    pengisian: 'tujuan'
  };
  for(const [param, group] of Object.entries(map)){
    if(p.has(param)){
      const val = p.get(param);
      formState[group] = val;
      document.querySelectorAll(`[data-group="${group}"]`).forEach(el => el.innerText = val);
    }
  }
  // Kalau dibuka langsung dengan jenis=bdn & no. dokumennya masih format "DO-GNM", samakan jadi "BDN-GNM"
  if(p.get('do')){
    convertDoNoPrefix();
    document.querySelectorAll('[data-group="doNo"]').forEach(el => el.innerText = formState.doNo);
  }
}

function getFileName(ext){
  const el = document.querySelector('[data-group="doNo"]');
  const label = docType === 'bdn' ? 'BDN' : 'DO';
  const raw = (el ? el.innerText.trim() : label).replace(/[\\/:*?"<>|]/g,'-') || label;
  return raw + '.' + ext;
}

function resetForm(){
  if(confirm('Kembalikan semua isi ke kosong / data kiriman awal?')) location.reload();
}

async function exportPdf(){
  if(window.librariesReady) await window.librariesReady;
  if(window.librariesFailed || typeof html2canvas === 'undefined' || !window.jspdf){
    alert('Gagal memuat komponen pembuat PDF (html2canvas/jsPDF).\n\nIni biasanya karena koneksi internet/jaringan Anda memblokir akses ke CDN. Coba:\n1. Ganti jaringan (misal pakai data seluler/hotspot HP)\n2. Matikan VPN / firewall / antivirus sementara\n3. Coba buka pakai browser lain (Chrome/Edge)\n\nSetelah itu klik ulang tombol ini.');
    return;
  }
  const pages = Array.from(document.querySelectorAll('.do-page'));
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ unit:'mm', format:'a4', orientation:'portrait' });
  const pageWidth = pdf.internal.pageSize.getWidth();
  const pageHeight = pdf.internal.pageSize.getHeight();

  for(let i=0; i<pages.length; i++){
    const clone = pages[i].cloneNode(true);
    clone.style.boxShadow = 'none';
    clone.style.margin = '0';
    const holder = document.createElement('div');
    holder.style.position = 'fixed';
    holder.style.left = '-99999px';
    holder.style.top = '0';
    holder.appendChild(clone);
    document.body.appendChild(holder);

    const canvas = await html2canvas(clone, { scale: 2, useCORS: true });
    document.body.removeChild(holder);

    let imgWidth = pageWidth;
    let imgHeight = (canvas.height * imgWidth) / canvas.width;
    if(imgHeight > pageHeight){
      imgHeight = pageHeight;
      imgWidth = (canvas.width * imgHeight) / canvas.height;
    }
    const x = (pageWidth - imgWidth) / 2;
    const y = 0;
    const imgData = canvas.toDataURL('image/jpeg', 0.98);
    if(i > 0) pdf.addPage();
    pdf.addImage(imgData, 'JPEG', x, y, imgWidth, imgHeight);
  }
  pdf.save(getFileName('pdf'));
}

function exportDocx(){
  try{
    const pages = Array.from(document.querySelectorAll('.do-page'));
    const pageBreak = `<br clear=all style='mso-special-character:line-break;page-break-before:always'>`;
    const bodyHtml = pages.map((p,i) => (i>0 ? pageBreak : '') + p.outerHTML).join('\n');
    const htmlContent = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
    <head>
    <meta charset="utf-8">
    <title>${docType === 'bdn' ? 'Bunkering Delivery Note' : 'Delivery Order'}</title>
    <!--[if gte mso 9]><xml>
    <w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom><w:DoNotOptimizeForBrowser/></w:WordDocument>
    </xml><![endif]-->
    <style>
      body{font-family:'Segoe UI',Calibri,Arial,sans-serif;}
      .do-page{page-break-after:always;}
      .side-tab{width:9mm;}
    </style>
    </head>
    <body>${bodyHtml}</body></html>`;

    const blob = new Blob(['\ufeff' + htmlContent], {type: 'application/msword'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = getFileName('doc');
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 3000);
  }catch(err){
    console.error('exportDocx error:', err);
    alert('Gagal membuat file Word.\n\nDetail error: ' + (err && err.message ? err.message : err) + '\n\nCoba refresh halaman lalu ulangi, atau pakai tombol "Download PDF" sebagai alternatif.');
  }
}

detectDocTypeFromParams();
detectVerifyUrlFromParams();
renderPages();
setupSync();
autoFillFromParams();
updateToggleUI();
</script>
